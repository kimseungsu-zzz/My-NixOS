// Installed to <gradle user home>/init.d by the WPILib post-install script.
//
// GradleRIO only registers remote repositories unless wpi.maven.useLocal is set,
// and the local path it would use is fixed when the plugin applies, from a year
// that cannot be changed afterwards. That leaves an offline install unable to
// resolve anything the Gradle cache does not already hold - most visibly the
// roboRIO JRE, which makes deploy fail on a machine that has never been online.
//
// Adding the shipped repository here, ahead of the remotes, sidesteps all of
// that and needs no edits to any project.

def wpilibMaven = new File("@INSTALL_DIR@/maven")

if (wpilibMaven.isDirectory()) {
    def repoUri = wpilibMaven.toURI()

    // Plugin resolution happens against settings.gradle, not the project. The
    // settings.gradle the extension stamps out lists gradlePluginPortal() ahead
    // of the local frcHome repository, so the shipped one is moved to the front
    // here for the same reason it is below: Gradle walks the list in order, and
    // an unreachable remote is an error rather than a miss.
    settingsEvaluated { settings ->
        def pluginRepos = settings.pluginManagement.repositories
        if (pluginRepos.findByName('WPILibLocalPlugins') == null) {
            def repo = pluginRepos.maven {
                name = 'WPILibLocalPlugins'
                url = repoUri
            }
            pluginRepos.remove(repo)
            pluginRepos.add(0, repo)
        }
    }

    // Dependencies. GradleRIO adds its remotes during evaluation, so this runs
    // afterwards and moves the local repository to the front: Gradle walks them
    // in order, and an unreachable remote is an error rather than a miss.
    allprojects { project ->
        project.afterEvaluate {
            def existing = project.repositories.findByName('WPILibLocal2020')
            if (existing == null) {
                def repo = project.repositories.maven {
                    name = 'WPILibLocal2020'
                    url = repoUri
                }
                project.repositories.remove(repo)
                project.repositories.add(0, repo)
            }
        }
    }
}
